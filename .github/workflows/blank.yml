name: Build Site APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded zip
        run: |
          Z="$(ls -v televizia_site_app*.zip | tail -1)"
          echo "Using $Z"
          mkdir -p /tmp/proj
          unzip -oq "$Z" -d /tmp/proj
          S="$(find /tmp/proj -name settings.gradle.kts | head -1)"
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        run: |
          cd "$PROJ"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/televizia-site-app.apk"
      - uses: actions/upload-artifact@v4
        with: { name: televizia-site-app, path: televizia-site-app.apk }
      - name: Publish APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: site-app-${{ github.run_number }}
          name: TELEVIZIA საიტი (აპლიკაცია) #${{ github.run_number }}
          files: televizia-site-app.apk
